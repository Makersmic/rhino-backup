# =====================================================================
# GUIDED CNC (SPINDLE) JOB SETUP
# =====================================================================
# Subtractive-manufacturing workflow for the Spindle toolhead: safety
# checklist, manual work-zero (XY then Z), spindle warmup, then start.
#
# NOTE ON SPINDLE SPEED: variables.cfg stores a target RPM per material
# (e.g. 12000 for SOFT_WOOD), but SPINDLE_SPEED (tools/spindle.cfg) is
# an open-loop PWM duty cycle to the ESC - there's no tachometer or
# calibrated RPM-to-duty curve anywhere in this config. This workflow
# shows the material's target RPM as a reference label and ramps to a
# starting duty cycle you can nudge up/down before cutting - it is NOT
# closed-loop RPM control. If you add a calibration curve later, the
# duty values below (CNC_BASE_DUTY, CNC_DUTY_STEP) are the place to
# wire real RPM math in.
#
# Entry point: CNC_JOB_SETUP
# =====================================================================

[gcode_macro CNC_JOB_SETUP]
description: Guided setup for a spindle (CNC) job - safety check, work-zero, spindle warmup, start.
variable_duty: 0.6
gcode:
  {% set TOOLHEAD = printer.save_variables.variables.set_material_toolhead|default("Spindle") %}
  {% set MATERIAL = printer.save_variables.variables.set_material_material|default("SOFT_WOOD") %}
  {% set target_rpm = printer.save_variables.variables.set_material_spindle_speed|default(10000) %}
  {% set feed_rate = printer.save_variables.variables.set_material_feed_rate|default(500) %}

  RESPOND TYPE=command MSG="action:prompt_begin CNC Job Setup"
  RESPOND TYPE=command MSG="action:prompt_text Toolhead: {TOOLHEAD} / Material: {MATERIAL}"
  RESPOND TYPE=command MSG="action:prompt_text Reference speed: {target_rpm} RPM, feed {feed_rate} mm/min"
  RESPOND TYPE=command MSG="action:prompt_text Before continuing, confirm:"
  RESPOND TYPE=command MSG="action:prompt_text - Stock is clamped/secured to the bed"
  RESPOND TYPE=command MSG="action:prompt_text - Cutting bit is seated and collet is tight"
  RESPOND TYPE=command MSG="action:prompt_text - Dust collection / chip evacuation is ready"
  RESPOND TYPE=command MSG="action:prompt_text - Eye and hearing protection on, work area clear"
  RESPOND TYPE=command MSG="action:prompt_button All Confirmed|_CNC_ZERO_XY|success"
  RESPOND TYPE=command MSG="action:prompt_button Cancel|_CLOSE_PROMPT|danger"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _CNC_ZERO_XY]
description: Instructs jogging to the stock's XY origin, then sets that as work zero.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Set XY Work Zero"
  RESPOND TYPE=command MSG="action:prompt_text Using Mainsail's move panel, jog the bit over the XY origin corner of your stock (commonly the front-left corner)."
  RESPOND TYPE=command MSG="action:prompt_text Click below once positioned."
  RESPOND TYPE=command MSG="action:prompt_button Set XY Zero Here|_CNC_ZERO_Z|success"
  RESPOND TYPE=command MSG="action:prompt_button Abort|_CNC_ABORT|danger"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _CNC_ZERO_Z]
description: Marks the current XY as work zero and prompts for the Z touch-off.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  G92 X0 Y0
  M117 XY zero set

  RESPOND TYPE=command MSG="action:prompt_begin Set Z Work Zero"
  RESPOND TYPE=command MSG="action:prompt_text CAUTION: there is no touch-off probe configured for this tool - jog Z down manually and slowly."
  RESPOND TYPE=command MSG="action:prompt_text Lower the bit in small steps until it just touches the top of the stock, then click below."
  RESPOND TYPE=command MSG="action:prompt_button Set Z Zero Here|_CNC_WARMUP|success"
  RESPOND TYPE=command MSG="action:prompt_button Abort|_CNC_ABORT|danger"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _CNC_ABORT]
description: Safe bailout from CNC setup - stops the spindle and lifts Z before closing.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  Spindle_DEACTIVATE
  G91
  G1 Z10 F600
  G90
  M117 CNC setup aborted


[gcode_macro _CNC_WARMUP]
description: Ramps the spindle up to a starting duty cycle over a short dwell.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 Z zero set - warming up spindle
  RESPOND TYPE=command MSG="action:notify Warming up spindle"
  G91
  G1 Z10 F600
  G90

  Spindle_ACTIVATE
  SET_PIN PIN=SPINDLE_SPEED VALUE=0.4 PWM_CYCLE_TIME=0.0025
  G4 P2000
  SET_PIN PIN=SPINDLE_SPEED VALUE={printer["gcode_macro CNC_JOB_SETUP"].duty} PWM_CYCLE_TIME=0.0025
  G4 P2000

  _CNC_READY


[gcode_macro _CNC_READY]
description: Final confirmation before starting the job, with duty-cycle nudge buttons.
gcode:
  {% set duty = printer["gcode_macro CNC_JOB_SETUP"].duty %}
  RESPOND TYPE=command MSG="action:prompt_begin Ready to Cut"
  RESPOND TYPE=command MSG="action:prompt_text Spindle running at {"%.0f"|format(duty * 100)}% duty. Confirm dust collection is running."
  RESPOND TYPE=command MSG="action:prompt_button Start Job|_CNC_START|success"
  RESPOND TYPE=command MSG="action:prompt_button Speed Up|_CNC_ADJUST_SPEED DELTA=0.05|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Slow Down|_CNC_ADJUST_SPEED DELTA=-0.05|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Abort|_CNC_ABORT|danger"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _CNC_ADJUST_SPEED]
description: Nudges the spindle duty cycle up or down, clamped to a safe 0.3-1.0 range.
gcode:
  {% set DELTA = params.DELTA|float %}
  {% set current = printer["gcode_macro CNC_JOB_SETUP"].duty %}
  {% set new_duty = [[current + DELTA, 0.3]|max, 1.0]|min %}
  SET_GCODE_VARIABLE MACRO=CNC_JOB_SETUP VARIABLE=duty VALUE={new_duty}
  SET_PIN PIN=SPINDLE_SPEED VALUE={new_duty} PWM_CYCLE_TIME=0.0025
  RESPOND TYPE=command MSG="action:prompt_end"
  _CNC_READY


[gcode_macro _CNC_START]
description: Starts the currently-loaded G-code job (select it in Mainsail's file panel first).
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 CNC job starting...
  RESPOND TYPE=command MSG="action:notify CNC job starting"
  SDCARD_PRINT_FILE
