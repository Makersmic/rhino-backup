# =====================================================================
# GUIDED DRAG-KNIFE JOB SETUP
# =====================================================================
# NOTE: blade pressure (variables.cfg 'pressure', in grams) has no
# actuator anywhere in this config - no output_pin or servo controls
# it. It's a reference number for a physical spring-tension adjustment
# on the toolhead itself, not something this workflow can set in
# software. The prompts below tell you the target value and ask you to
# dial it in by hand, rather than pretending to control it.
#
# Entry point: DRAGKNIFE_JOB_SETUP
# =====================================================================

[gcode_macro DRAGKNIFE_JOB_SETUP]
description: Guided setup for a drag-knife job - material check, blade pressure (manual), Z touch-off, test cut, start.
gcode:
  {% if printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("DRAGKNIFE_JOB_SETUP sets a work zero, which a running or paused job's RESUME would undo. Run it BEFORE the job starts: DRAGKNIFE_JOB_SETUP FILE=<name.gcode>") }
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_START_JOB_FILE VARIABLE=file VALUE="'{params.FILE|default("")}'"
  {% set TOOLHEAD = printer.save_variables.variables.set_material_toolhead|default("DragKnife") %}
  {% set MATERIAL = printer.save_variables.variables.set_material_material|default("VINYL") %}
  {% set pressure = printer.save_variables.variables.set_material_blade_pressure|default(150) %}
  {% set feed_rate = printer.save_variables.variables.set_material_feed_rate|default(800) %}

  RESPOND TYPE=command MSG="action:prompt_begin Drag Knife Job Setup"
  RESPOND TYPE=command MSG="action:prompt_text Toolhead: {TOOLHEAD} / Material: {MATERIAL}"
  RESPOND TYPE=command MSG="action:prompt_text Target blade pressure: {pressure}g, feed {feed_rate} mm/min"
  RESPOND TYPE=command MSG="action:prompt_text Before continuing, confirm:"
  RESPOND TYPE=command MSG="action:prompt_text - Material is taped/secured flat with no wrinkles"
  RESPOND TYPE=command MSG="action:prompt_text - A cutting mat is under the material if needed"
  RESPOND TYPE=command MSG="action:prompt_text - Blade is installed and the spring-tension dial is set to approximately {pressure}g (manual - not software controlled)"
  RESPOND TYPE=command MSG="action:prompt_button All Confirmed|_DK_ZERO_Z|primary"
  RESPOND TYPE=command MSG="action:prompt_button Cancel|_CLOSE_PROMPT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _DK_ZERO_Z]
description: Guides a manual Z touch-off for the blade against the material surface.
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Set Z Work Zero"
  RESPOND TYPE=command MSG="action:prompt_text Using Mainsail's move panel, jog the blade down in small steps until it just touches the material surface."
  RESPOND TYPE=command MSG="action:prompt_button Set Z Zero Here|_DK_TEST_CUT|primary"
  RESPOND TYPE=command MSG="action:prompt_button Abort|_DK_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _DK_ABORT]
description: Safe bailout - lifts the blade clear of the material before closing.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  G91
  G1 Z10 F600
  G90
  M117 Drag knife setup aborted


[gcode_macro _DK_TEST_CUT]
description: Sets Z zero, then cuts a small test mark to check pressure/depth before the real job.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  G92 Z0
  M117 Cutting test mark...

  # Small 10mm test mark - plunge, short diagonal cut, retract.
  G91
  G1 Z-0.3 F200
  G1 X10 Y10 F{printer.save_variables.variables.set_material_feed_rate|default(800)}
  G1 Z2 F600
  G90

  RESPOND TYPE=command MSG="action:prompt_begin Check Test Cut"
  RESPOND TYPE=command MSG="action:prompt_text Did the blade cut cleanly through the material without tearing or dragging?"
  RESPOND TYPE=command MSG="action:prompt_button Yes - Ready|_DK_READY|primary"
  RESPOND TYPE=command MSG="action:prompt_button No - Adjust Pressure/Depth|_DK_ADJUST|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Abort|_DK_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _DK_ADJUST]
description: Reminds you the pressure dial is manual, then lets you re-run the test cut.
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Adjust Pressure"
  RESPOND TYPE=command MSG="action:prompt_text Adjust the spring-tension dial on the toolhead by hand:"
  RESPOND TYPE=command MSG="action:prompt_text - Not cutting through: increase pressure or lower Z slightly"
  RESPOND TYPE=command MSG="action:prompt_text - Tearing / cutting the backing: decrease pressure or raise Z slightly"
  RESPOND TYPE=command MSG="action:prompt_button Re-test Cut|_DK_TEST_CUT|primary"
  RESPOND TYPE=command MSG="action:prompt_button Abort|_DK_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _DK_READY]
description: Final confirmation before starting the job.
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Ready to Cut"
  RESPOND TYPE=command MSG="action:prompt_text Test cut confirmed good. Starting the job will cut the full design."
  RESPOND TYPE=command MSG="action:prompt_button Start Job|_DK_START|primary"
  RESPOND TYPE=command MSG="action:prompt_button Abort|_DK_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _DK_START]
description: Starts the job file given as FILE= to DRAGKNIFE_JOB_SETUP.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 Drag knife job starting...
  RESPOND TYPE=command MSG="action:notify Drag knife job starting"
  _START_JOB_FILE
