[gcode_shell_command hello_world]
command: echo hello world
timeout: 2.
verbose: True
[gcode_macro HELLO_WORLD]
gcode:
    RUN_SHELL_COMMAND CMD=hello_world

# Runs klipper-backup (commits + pushes printer_data/config to your GitHub backup repo).
# Console:  BACKUP_CFG            or   BACKUP_CFG MSG=after_tool_swap_fix
# Assumes the default install path /home/pi/klipper-backup - change it if your user differs.
[gcode_shell_command backup_cfg]
command: bash /home/pi/klipper-backup/script.sh
timeout: 120.
verbose: True

[gcode_macro BACKUP_CFG]
description: Back up printer_data/config to GitHub via klipper-backup (optional MSG= commit message, no spaces).
gcode:
    {% if params.MSG is defined %}
        RUN_SHELL_COMMAND CMD=backup_cfg PARAMS="{params.MSG}"
    {% else %}
        RUN_SHELL_COMMAND CMD=backup_cfg
    {% endif %}
    RESPOND MSG="klipper-backup started - watch this console for its output"

[gcode_shell_command run_klipper_backup]
command: /home/pi/klipper-backup/script.sh
timeout: 30.0
verbose: True

[gcode_macro BACKUP_CONFIG]
description: Trigger a safe GitHub backup via klipper-backup
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin 💾 Backing up Configuration"
  RESPOND TYPE=command MSG="action:prompt_text Syncing your printer settings, macros, and configuration history directly to GitHub..."
  RESPOND TYPE=command MSG="action:prompt_text Please wait a moment..."
  
  # New interactive feature: Add a helper link directly into the waiting prompt!
  RESPOND TYPE=command MSG="action:prompt_button 🔍 View Backup Paths|SHOW_BACKUP_LOCATION|info"
  RESPOND TYPE=command MSG="action:prompt_show"

  RUN_SHELL_COMMAND CMD=run_klipper_backup

  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND MSG="✅ Klipper backup completed successfully!"


[gcode_macro SHOW_BACKUP_LOCATION]
description: Displays where your config files are being backed up
# 👇 EDIT THESE THREE VARIABLES TO MATCH YOUR ACTUAL SETUP
variable_github_username: "YOUR_GITHUB_USERNAME"
variable_github_repo: "YOUR_REPOSITORY_NAME"
variable_pi_username: "pi" 
gcode:
  # Open a styled modal prompt window on screen
  RESPOND TYPE=command MSG="action:prompt_begin 📂 Backup Destination Map"
  
  # Section 1: Remote Location (GitHub)
  RESPOND TYPE=command MSG="action:prompt_text 🌐 CLOUD STORAGE (GitHub):"
  RESPOND TYPE=command MSG="action:prompt_text https://github.com/{github_username}/{github_repo}"
  RESPOND TYPE=command MSG="action:prompt_text "
  
  # Section 2: Local Paths on the machine
  RESPOND TYPE=command MSG="action:prompt_text 💻 LOCAL MACHINE PATHS:"
  RESPOND TYPE=command MSG="action:prompt_text • Config Directory: /home/{pi_username}/printer_data/config/"
  RESPOND TYPE=command MSG="action:prompt_text • Backup Script: /home/{pi_username}/klipper-backup/script.sh"
  RESPOND TYPE=command MSG="action:prompt_text • Local Git Cache: /home/{pi_username}/config_backup/"
  
  # Footer exit button
  RESPOND TYPE=command MSG="action:prompt_footer_button Close Window|action:prompt_end|info"
  RESPOND TYPE=command MSG="action:prompt_show"
