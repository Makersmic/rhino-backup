# ====================================================================
# 🗂️ SECTION 1: THE DYNAMIC NEW-TOOLHEAD WIZARD (ENTRY POINT)
# ====================================================================

[gcode_macro ADD_NEW_TOOLHEAD_WIZARD]
description: Interactive graphical interface to register custom hardware capabilities into Klipper
gcode:
  {% if printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("Wizard Blocked: Cannot register new hardware configurations while a job is active.") }
  {% endif %}

  # Step 1: Open the template choice prompt window
  RESPOND TYPE=command MSG="action:prompt_begin 🛠️ Create Custom Toolhead Profile"
  RESPOND TYPE=command MSG="action:prompt_text Choose a baseline capability template for your new hardware:"
  RESPOND TYPE=command MSG="action:prompt_text "
  RESPOND TYPE=command MSG="action:prompt_text • Subtractive: Blends G54 workspace offsets with manual/probed zeros."
  RESPOND TYPE=command MSG="action:prompt_text • Extrusion: Hooks into 3D printer deposition paths."
  
  # Interactive Template Buttons
  RESPOND TYPE=command MSG="action:prompt_button ⚙️ Subtractive Template (HotWire/Needle)|_CHOOSE_CAPABILITIES TYPE=SUBTRACTIVE|primary"
  RESPOND TYPE=command MSG="action:prompt_button 🧵 Extrusion Template (New Printhead)|_CHOOSE_CAPABILITIES TYPE=ADDITIVE|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Exit Wizard|action:prompt_end|error"
  RESPOND TYPE=command MSG="action:prompt_show"


# ====================================================================
# 🎛️ SECTION 2: CAPABILITY MATRIX CONFIGURATOR
# ====================================================================

[gcode_macro _CHOOSE_CAPABILITIES]
gcode:
  {% set TYPE = params.TYPE|string %}
  RESPOND TYPE=command MSG="action:prompt_end"

  # Step 2: Read live data from your universal PF4 umbilical sensor line
  # This displays the live resistor value so you don't have to guess it!
  {% set live_id = printer.extruder.temperature|default(0.0)|float %}

  RESPOND TYPE=command MSG="action:prompt_begin 🔬 Configure Toolhead Capabilities"
  RESPOND TYPE=command MSG="action:prompt_text Selected Base: {TYPE} Mode"
  RESPOND TYPE=command MSG="action:prompt_text Stored Sensor ID (PF4 Line Reading): {live_id}°C/Units"
  RESPOND TYPE=command MSG="action:prompt_text "
  RESPOND TYPE=command MSG="action:prompt_text Select the primary power modulation channel for this tool:"

  # Choose how power is sent through the 21-pin umbilical channel
  {% if TYPE == "SUBTRACTIVE" %}
    RESPOND TYPE=command MSG="action:prompt_button Option A: Modulated PWM Channel (Hot Wire)|_GENERATE_TOOL_FILE TYPE=SUBTRACTIVE CAP=PWM ID={live_id}|warning"
    RESPOND TYPE=command MSG="action:prompt_button Option B: Reciprocating Oscillator (Needle Cutter)|_GENERATE_TOOL_FILE TYPE=SUBTRACTIVE CAP=OSCILLATOR ID={live_id}|warning"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_button Standard Deposition Stepper Current Config|_GENERATE_TOOL_FILE TYPE=ADDITIVE CAP=STEPPER ID={live_id}|primary"
  {% endif %}
  
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|ADD_NEW_TOOLHEAD_WIZARD|info"
  RESPOND TYPE=command MSG="action:prompt_show"


# ====================================================================
# 📝 SECTION 3: AUTOMATED FILE GENERATION LAYER
# ====================================================================

[gcode_macro _GENERATE_TOOL_FILE]
gcode:
  {% set TYPE = params.TYPE|string %}
  {% set CAP = params.CAP|string %}
  {% set ID = params.ID|float %}
  RESPOND TYPE=command MSG="action:prompt_end"

  # 1. Output the compiled hardware parameters directly to your Mainsail Console
  RESPOND MSG="===================================="
  RESPOND MSG="🚀 CUSTOM TOOLHEAD PROFILE GENERATED"
  RESPOND MSG="===================================="
  RESPOND MSG="  • Base Class: {TYPE}"
  RESPOND MSG="  • Operating Capability: {CAP}"
  RESPOND MSG="  • Umbilical Pin Assignment: Shared Channel A"
  RESPOND MSG="  • Registered PF4 Resistor Mark: {ID}"
  RESPOND MSG="------------------------------------"
  RESPOND MSG="👉 To permanently write this hardware, add a [gcode_macro CUSTOM_TOOL_{CAP}] entry into your toolheads configurations config."
  RESPOND MSG="===================================="

  # 2. Render final confirmation dashboard window
  RESPOND TYPE=command MSG="action:prompt_begin ✅ Toolhead Profile Ready"
  RESPOND TYPE=command MSG="action:prompt_text Your custom capability configuration metadata has been successfully generated and compiled."
  RESPOND TYPE=command MSG="action:prompt_text Check your console tab for the raw code text lines to save into your files."
  RESPOND TYPE=command MSG="action:prompt_footer_button Finish Wizard|action:prompt_end|success"
  RESPOND TYPE=command MSG="action:prompt_show"


# ====================================================================
# 🗑️ SECTION 4: UNIFIED DELETION MODULE
# ====================================================================

[gcode_macro DELETE_TOOLHEAD_UTILITY]
description: Interactive panel to cleanly wipe custom tool profiles from registry cache memory
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin 🗑️ Delete Custom Toolhead Profile"
  RESPOND TYPE=command MSG="action:prompt_text Select a registered custom extension slot to wipe from active tracking profiles:"
  RESPOND TYPE=command MSG="action:prompt_text (Warning: This action will reset target profile variables to defaults)."
  
  # Pull slot values dynamically from your central variables dictionary map
  {% set tool_mapping = printer["gcode_macro VARIABLES"].tool_mapping %}
  {% for slot, name in tool_mapping.items()|sort %}
    {% if slot > 0 %} # Keep slot 0 (empty carriage) safe from deletion profiles
      RESPOND TYPE=command MSG="action:prompt_button Wipe Slot {slot}: {name}|_CLEAR_SLOT_CACHE SLOT={slot}|error"
    {% endif %}
  {% endfor %}
  
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|action:prompt_end|info"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _CLEAR_SLOT_CACHE]
gcode:
  {% set slot = params.SLOT|int %}
  RESPOND TYPE=command MSG="action:prompt_end"
  
  # Reset the target slot markers back to clean default empty profiles
  SAVE_VARIABLE VARIABLE=custom_tool_slot_{slot}_active VALUE=0
  
  RESPOND MSG="🗑️ Slot {slot} profile definitions successfully cleared from system dictionary tracking files."
