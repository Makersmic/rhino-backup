[gcode_macro home]
description: checks if x, y, & z axis have been homed.  If not, then homes all axis.
gcode:  
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=3
  {% set ns = namespace(MUSTHOME= false) %}
    {% for AXIS in ["x", "y", "z"] %}
        {% if AXIS in printer.toolhead.homed_axes %}
            M117 {AXIS} IS ALREADY HOMED
        {% else %}
            M117 {AXIS} NOT HOMED
            {% set ns.MUSTHOME = true %}
        {% endif %}
    {% endfor %}   
    {% if ns.MUSTHOME == true %}
        G28
        M117 HOMING
    {% endif %}

[gcode_macro TURN_ON_MOTORS]
description: Initialize the stepper motors.
gcode:
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=1
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=1
  SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
  #SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1

#######################
###### Servo Macros####
#######################
# Servo Macros
[gcode_macro ACTIVATE_SERVO]
description: Set the position of the servo shaft to mid-point(90 degrees) and set pwm cycle time for servo.
gcode:
  SET_PIN PIN=SERVO_LASER VALUE=0.075 PWM_CYCLE_TIME=0.02  #VALUE=0.075(90 degrees)
  LEDFLASH

[gcode_macro DEACTIVATE_SERVO]
description: Set the position of the servo shaft to mid-point(90 degrees) and set pwm cycle time for servo.
#use this to ensure servo shaft is centered at the end of using tool head
gcode:
  SET_PIN PIN=SERVO_LASER VALUE=0.075 PWM_CYCLE_TIME=0.02  #VALUE=0.075(90 degrees)
  LEDFLASH

[gcode_macro SET_SERVO_ANGLE]
#set the servo angle or the laser intensity depending on how it is specified in the gcode
description: Set the angle of the servo.
gcode:
  {% set physical_slot = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  
  # ONLY allow servo pulses if SwitchFly (Slot 1) is physically mounted
  {% if physical_slot == 1 %}
    {% set angle = params.ANGLE|default(0)|float %}
    # Your existing servo pin writing logic goes here safely:
    SET_PIN PIN=SERVO_LASER VALUE={angle / 180.0} # Example proportional mapping
  {% else %}
    { action_respond_info("Servo command blocked: Physical toolhead attached does not possess a positioning servo.") }
  {% endif %}

[gcode_macro TEST_SERVO]
description: Rotate servo shaft to 0, 90, 180, 90 degrees.
gcode:
  ACTIVATE_SERVO
  SET_SERVO_ANGLE ANGLE=0
  G4 P1000
  SET_SERVO_ANGLE ANGLE=90
  G4 P1000
  SET_SERVO_ANGLE ANGLE=180
  G4 P1000
  SET_SERVO_ANGLE ANGLE=90
  LEDFLASH

[gcode_macro M0]
gcode:
    PAUSE

# ====================================================================
# 🦺 MASTER UNIFIED ROUTER FOR MODULATED POWER CONTROLS (M3/M4/M5)
# ====================================================================

[gcode_macro M3]
description: Master Unified Spindle/Laser On Router - Safe Capability Dispatcher
gcode:
  {% set physical_slot = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% set s_val = params.S|default(0)|float %}

  # DISPATCH TO LASER (Slot 2 = LightSaber)
  {% if physical_slot == 2 %}
    {% set s_max = printer["gcode_macro VARIABLES"].laser_s_max|default(1000)|float %}
    {% set power = [[(s_val / s_max), 0.0]|max, 1.0]|min %}
    SET_PIN PIN=SERVO_LASER VALUE={power}

  # DISPATCH TO CNC SPINDLE (Slot 3 = HotJoe)
  {% elif physical_slot == 3 %}
    # Map raw incoming CAM speed commands cleanly to your RC ESC 400Hz pulse envelope
    # Calculates relative throttle between 0.3 (arm floor) and 1.0 (max limit)
    {% set scaled_duty = [[0.3 + (s_val / 24000.0) * 0.7, 0.3]|max, 1.0]|min %}
    SET_PIN PIN=SPINDLE_SPEED VALUE={scaled_duty} PWM_CYCLE_TIME=0.0025

  # SAFE DISMISSAL FOR ADDITIVE MODES (BlockOne / SwitchFly)
  {% else %}
    { action_respond_info("M3 Ignored: Active additive toolhead ignores rotational speed inputs.") }
  {% endif %}

[gcode_macro M4]
description: Master Unified CCW/Alternative Modulated Power Router
gcode:
  # Route identically to M3 for baseline operations
  M3 {rawparams}

[gcode_macro M5]
description: Master Unified Power Shutdown - Instantly forces 0% power across all capability profiles
gcode:
  # Absolute hardware safety clamp down across all shared pins simultaneously
  SET_PIN PIN=SERVO_LASER VALUE=0.0
  SET_PIN PIN=SPINDLE_SPEED VALUE=0.3 PWM_CYCLE_TIME=0.0025
  RESPOND MSG="❄️ Modulated power channels forced to neutral safety limits."


# ====================================================================
# 🔒 MASTER HARDWARE OVERRIDE FOR TRUE UMBILICAL FAILSALES
# ====================================================================

[gcode_macro EMERGENCY_STOP]
description: Rhino Multi-Tool True Failsafe Kill Switch - Shuts down ALL power rails and heaters
gcode:
  # 1. Kill all potential power rails instantly to prevent thermal or fire hazards
  SET_PIN PIN=LASER_INITIALIZE VALUE=0.0
  SET_PIN PIN=Spindle_power VALUE=0
  
  # 2. Force all shared umbilical channel lines to absolute zero duty cycle
  SET_PIN PIN=SERVO_LASER VALUE=0.0
  SET_PIN PIN=SPINDLE_SPEED VALUE=0.0
  
  # 3. Kill all heating elements across the frame
  TURN_OFF_HEATERS
  M107 # Kill cooling fans
  
  RESPOND TYPE=error MSG="🚨 EMERGENCY STOP EXECUTED: All multi-tool power lines and h
