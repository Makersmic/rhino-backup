[gcode_macro CREATE_TOOLHEAD_LOG]
description: Creates a file named toolhead_log.txt in the logs directory
gcode:
    RUN_SHELL_COMMAND CMD=create_file
    M117 File created in logs directory




# NOTE: [pause_resume], [display_status], and [respond] are commented
# out here. printer.cfg's very first line is "[include mainsail.cfg]" -
# the standard mainsail-crew/mainsail-config file (confirmed installed
# via moonraker.conf's [update_manager mainsail-config]) - and that
# file's well-known standard content already declares all three of
# these sections, along with a base PAUSE/RESUME/CANCEL_PRINT. Unlike
# [gcode_macro ...] sections, these do NOT support "rename_existing" -
# Klipper has no override mechanism for them, so a second declaration
# anywhere in the include tree is a hard "section already defined"
# error at startup. This file's own CANCEL_PRINT override below is
# fine as-is (rename_existing IS how gcode_macro overrides are meant
# to work) - only these three bare sections were the problem.
# If your mainsail.cfg does NOT define these (e.g. a heavily trimmed
# custom version), uncomment them back in.
#[pause_resume]
#[display_status]
#[respond]

[gcode_macro CANCEL_PRINT]
description: Cleanly cancel the current print
rename_existing: CANCEL_PRINT_BASE
gcode:
    M117 Canceling print...
    RESPOND TYPE=command MSG="action:notify Print canceled"
    TURN_OFF_HEATERS
    M107 ; Turn off fan
    G91
    G1 Z10 F900 ; Lift Z
    G90
    G28 X Y ; Home X and Y
    SAVE_VARIABLE VARIABLE=pause_state VALUE="'none'"
    CANCEL_PRINT_BASE
    M117 Print canceled
    LEDFLASH


